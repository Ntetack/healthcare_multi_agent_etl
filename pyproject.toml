[project]
name = "healthcare-multi-agent-etl"
version = "0.1.0"
description = "Multi-agent ETL framework for heterogeneous healthcare data -> OMOP CDM"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL / R+DQD / real vocab data",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
