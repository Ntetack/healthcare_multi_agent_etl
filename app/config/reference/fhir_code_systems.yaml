# Reference file for FHIR sources - written by a human, never generated by
# an agent (same status as omop_vocabulary_fields.yaml).
#
# 1. code_systems: FHIR code system URI (or its OID form) -> the `standard`
#    token used by the Mapping Agent, i.e. a key of STANDARD_TO_VOCABULARY.
#    Source: the "Systems" page of the HL7 FHIR specification
#    (hl7.org/fhir/terminologies-systems.html), which lists these URIs and
#    their OIDs.
#
#    Deliberately absent:
#      - http://hl7.org/fhir/sid/icd-9-cm (without /diagnosis or
#        /procedure): it covers both ICD9CM and ICD9Proc, which are two
#        different OMOP vocabularies, so it cannot be mapped to either one.
#      - http://unitsofmeasure.org (UCUM): units are not resolved by the
#        coded-field mechanism.
#      - HL7 terminology systems (condition-clinical, observation-category,
#        v3-ActCode...) and the CDC race and ethnicity system: they hold
#        value sets handled by curated mapping files, not vocabularies.
#
#    Note on ICD-10: the token ICD10 covers the OMOP vocabularies ICD10 and
#    ICD10CM. The URI icd-10-cm is the one used by US Core; it does not
#    appear in the part of the HL7 Systems page consulted, so confirm it
#    against your data.
code_systems:
  http://snomed.info/sct: SNOMED
  urn:oid:2.16.840.1.113883.6.96: SNOMED
  http://loinc.org: LOINC
  urn:oid:2.16.840.1.113883.6.1: LOINC
  http://www.nlm.nih.gov/research/umls/rxnorm: RxNorm
  urn:oid:2.16.840.1.113883.6.88: RxNorm
  http://hl7.org/fhir/sid/cvx: CVX
  urn:oid:2.16.840.1.113883.12.292: CVX
  http://www.ama-assn.org/go/cpt: CPT4
  urn:oid:2.16.840.1.113883.6.12: CPT4
  http://hl7.org/fhir/sid/ndc: NDC
  urn:oid:2.16.840.1.113883.6.69: NDC
  http://hl7.org/fhir/sid/icd-10: ICD10
  http://hl7.org/fhir/sid/icd-10-cm: ICD10
  http://hl7.org/fhir/sid/icd-9-cm/diagnosis: ICD9CM
  http://hl7.org/fhir/sid/icd-9-cm/procedure: ICD9Proc

# 2. event_code_paths: for each table, the element whose code identifies
#    the clinical event, as defined by the FHIR resource itself. Only these
#    elements get a coded-field declaration derived automatically. Reason
#    codes, categories and statuses are deliberately left out: they qualify
#    an event, they do not identify it. A declaration written by hand in the
#    batch metadata always takes precedence over a derived one.
event_code_paths:
  Condition: [code]
  Observation: [code]
  Observation_component: [code]
  Procedure: [code]
  MedicationRequest: [medicationCodeableConcept]
  MedicationAdministration: [medicationCodeableConcept]
  MedicationStatement: [medicationCodeableConcept]
  Immunization: [vaccineCode]
  AllergyIntolerance: [code]
  Encounter: [type]
