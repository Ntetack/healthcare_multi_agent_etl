# Reference file for FHIR sources - written by a human, never generated by
# an agent.
#
# Curated mappings for the value sets that FHIR itself defines. Unlike the
# curated files of a CSV source (specific to that source's own categories),
# these hold for ANY FHIR source, so they are shipped with the framework and
# applied automatically to every FHIR batch that carries the column.
#
# The shape is the one of the `fixed_value_mappings` section of a batch's
# metadata.yaml, with one difference: `mapping_file` is looked up in
# app/config/reference/fhir_mappings/. A declaration written by hand in the
# batch metadata for the same target field always takes precedence, which
# lets a source use its own file instead.
#
# Sources of the codes:
#   - Race: the OMB race categories of US Core (code system
#     urn:oid:2.16.840.1.113883.6.238). Not covered, on purpose: 2131-1
#     "Other Race" (discouraged by US Core for statistical analysis) and the
#     null flavors UNK and ASKU. A value that is not in the file stays
#     unresolved and is listed in the derivation log.
#   - Ethnicity: the same code system. 2186-5 is the code found in Synthea
#     data; confirm 2135-2 against your own data.
#   - Visit: the HL7 v3 ActCode values of Encounter.class found in Synthea
#     data (AMB, EMER, IMP). The other ActCode values (HH, VR, FLD, SS...)
#     are left out until their OMOP visit concept has been confirmed in the
#     loaded vocabulary: add a row to the CSV when it is.
fixed_value_mappings:
  person:
    race_concept_id:
      source_table: Patient
      source_field: extension.us-core-race.ombCategory.code
      source_field_column: code
      mapping_file: fhir_us_core_race_to_concept.csv
      mapping_column: race_concept_id
    ethnicity_concept_id:
      source_table: Patient
      source_field: extension.us-core-ethnicity.ombCategory.code
      source_field_column: code
      mapping_file: fhir_us_core_ethnicity_to_concept.csv
      mapping_column: ethnicity_concept_id
  visit_occurrence:
    visit_concept_id:
      source_table: Encounter
      source_field: class.code
      source_field_column: code
      mapping_file: fhir_encounter_class_to_visit_concept.csv
      mapping_column: visit_concept_id
